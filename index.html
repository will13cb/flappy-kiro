<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flappy Kiro</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #1a1a2e;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-canvas {
      /* Logical size is 480x640; CSS scales it and keeps the 480:640 ratio. */
      width: auto;
      height: auto;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 480 / 640;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
      touch-action: none;
      display: block;
    }
    #config-error {
      max-width: 480px;
      margin: 16px;
      padding: 16px;
      color: #ffffff;
      background: #7a1f1f;
      font-family: monospace;
      white-space: pre-wrap;
    }
    #config-error[hidden] {
      display: none;
    }
  </style>
</head>
<body>
  <canvas id="game-canvas" width="480" height="640" tabindex="0"
          role="img" aria-label="Flappy Kiro game. Press Space or click to flap, P to pause, M to mute.">
    Your browser does not support the canvas element, so Flappy Kiro cannot be played.
  </canvas>

  <!-- Shown by main.js in place of the canvas when the startup config is invalid. -->
  <div id="config-error" role="alert" hidden></div>

  <!-- Sounds are created and loaded by src/assets.js (not autoplayed; played on player input). -->

  <script type="module" src="src/main.js"></script>
</body>
</html>
