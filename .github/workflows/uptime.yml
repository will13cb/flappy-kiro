# Hourly uptime check for the deployed game. A failed run triggers GitHub's failed-workflow
# email to you. Note: GitHub pauses scheduled workflows after 60 days without repo activity.
name: Uptime check

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Check the page and its key files
        run: |
          set -eu
          # Default: https://<owner>.github.io/<repo>/ (scheduled runs carry no repository payload).
          SITE_URL="${SITE_URL:-https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/}"
          check() {
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 10 "$SITE_URL$1")
            if [ "$code" != "200" ]; then echo "::error::$SITE_URL$1 returned $code"; exit 1; fi
            echo "ok $code $SITE_URL$1"
          }
          check ''
          grep -q '<script type="module" src="src/main.js">' /tmp/body || { echo "::error::index.html does not load the game module"; exit 1; }
          check 'src/main.js'
          check 'assets/ghosty.png'
          check 'assets/music-menu.wav'
